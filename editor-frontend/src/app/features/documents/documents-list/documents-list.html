<div class="documents-page">
  <header class="header">
    <h1>Editor Colaborativo</h1>
  </header>

  <section class="new-document">
    <button (click)="createDocument()">+ Novo Documento</button>
  </section>

  <section class="documents-section">
    <h2>Meus Documentos</h2>

    <div class="documents-grid">
      @for (doc of documents; track doc.id) {
        <a class="document-card" [routerLink]="['/editor', doc.id]">
          <div class="preview"></div>

          <div class="title">
            {{ doc.title }}
          </div>
        </a>
      }
    </div>
  </section>
</div>
