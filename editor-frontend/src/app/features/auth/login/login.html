<div class="login-container">
  <div class="card">
    <h1>Editor Colaborativo</h1>

    <input type="email" placeholder="Email" [(ngModel)]="email" />

    <input type="password" placeholder="Senha" [(ngModel)]="password" />

    <button (click)="login()" [disabled]="loading">
      {{ loading ? "Entrando..." : "Entrar" }}
    </button>

    @if (errorMessage) {
      <p class="error">
        {{ errorMessage }}
      </p>
    }
  </div>
</div>
