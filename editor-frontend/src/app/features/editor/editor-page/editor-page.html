<div class="editor-page">
  <header class="editor-header">
    <div class="document-info">
      <span class="logo">📄</span>
      <h1>{{ docTitle }}</h1>
    </div>

    <span class="status">✓ Salvo</span>
  </header>

  <main class="editor-content">
    <textarea
      [(ngModel)]="content"
      (input)="onContentChange()"
      placeholder="Comece a escrever..."
    >
    </textarea>
  </main>
</div>
